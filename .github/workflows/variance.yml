name: variance

# The pages in `site/` against the baselines committed under `baselines/`,
# through git-LFS, on every pull request.
#
# The baselines are part of the repository, so accepting a change is a commit.
# A reviewer runs this workflow from the Actions tab on the pull request's
# branch, with **accept** ticked. That run accepts every changed page and pushes
# the new images to the branch as `github-actions[bot]`. The images are in the
# diff you approve, and they reach `main` with the code that changed them. The
# accepting run stays red, because it found the change it committed. The push
# starts the run that checks the new commit. Never dispatch it with **accept**
# on `main`: that run would push the images to `main` itself.
#
# The variance-authority repository opens a pull request here every week that
# changes a price on `pricing.html`, watches the check go red, accepts it with
# a dispatch on its branch, and closes the pull request without merging. That is
# its end-to-end test of the committed review flow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Run workflow, in the Actions tab
    inputs:
      accept:
        description: Accept what this branch renders, and commit the images to it
        type: boolean
        default: false

permissions:
  contents: write # the commit with the accepted images
  pull-requests: write # the comment

jobs:
  variance:
    concurrency:
      group: variance-${{ github.ref }}
      cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
    runs-on: ubuntu-24.04
    # The baselines were painted by this image's Chromium. It matches the
    # `playwright` pinned in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      # The image has no git-lfs, and the store refuses to read a pointer file
      # as an image.
      - run: apt-get update -qq && apt-get install -y -qq git-lfs

      # The branch rather than the merge, because the accept commits to it; a
      # dispatch is on its branch already. The token is the one that push uses:
      # a push made with `GITHUB_TOKEN` starts no workflow, so the commit would
      # get no check. Set `VARIANCE_PUSH_TOKEN` to a token with `contents: write`
      # here and the push starts the run that checks it.
      - uses: actions/checkout@v4
        with:
          lfs: true
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref }}
          token: ${{ secrets.VARIANCE_PUSH_TOKEN || github.token }}

      # The container runs as root and the workspace belongs to the runner's
      # user, so git refuses the accept's commit as "dubious ownership". The
      # checkout above trusts the directory only for its own commands.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: npm ci

      - uses: Variance-Authority/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-baselines: "${{ inputs.accept }}"
          exit-zero-on-changes: "${{ github.event_name == 'push' }}"
          to-accept: 'run the **variance** workflow on this branch with **accept** ticked. The accepted images are committed to this branch, and the next run compares against them.'
